spring.application.name=Resume-analyser-local

# Local profile: run without external MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:localdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Dummy keys for local runs
apiKey=local-mail-key
genKey=local-gen-key
application-id=local-adzuna-id
application-api-key=local-adzuna-key

